<!DOCTYPE html>
<html>
<head>
    <title>备份基金数据</title>
    <meta charset="utf-8"/>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="assets/css/amazeui.min.css">
    <link rel="stylesheet" href="assets/css/apple-design.css">
    <script type="text/javascript" src="js/jquery-1.8.3.js"></script>
    <script type="text/javascript" src="js/dialog.js"></script>
    <script type="text/javascript" src="js/moment.js"></script>
    <script type="text/javascript" src="js/common.js"></script>
    <script type="text/javascript" src="js/bak.js"></script>
</head>
<body>
<div class="am-padding app-shell">
    <div class="app-card app-header">
        <div class="app-title">
            <div>
                <h1>备份与还原</h1>
                <small>守护你在云端与本地的每一份基金数据</small>
            </div>
            <span class="am-link-cursor popup">返回基金列表</span>
        </div>
    </div>

    <div class="app-card">
        <div class="section-heading">云备份设置</div>
        <p class="description">绑定云端 API 以自动同步你的基金档案，确保多设备间始终保持一致。</p>
        <div class="field-group">
            <label for="apikey">接口 API</label>
            <input id="apikey" type="text" class="apikey" placeholder="请输入云备份服务提供的 API Key" />
        </div>
        <div class="app-actions">
            <button type="button" class="app-button record-api">保存</button>
            <button type="button" class="app-button secondary signup">申请接口</button>
        </div>

        <div class="am-backup-hide" style="display: none">
            <div class="section-heading" style="margin-top: 32px;">备份列表</div>
            <ul class="backup-list">
                <li>读取备份数据中...</li>
            </ul>
        </div>
    </div>

    <div class="app-card">
        <div class="section-heading">手动备份与还原</div>
        <p class="description">将 JSON 数据复制保存，以便在任意时间快速恢复当前的基金配置。</p>
        <div class="field-group">
            <label for="restore-content">备份数据</label>
            <textarea id="restore-content" class="restore-content" rows="9" placeholder="将您备份好的代码粘贴到此处，点击还原数据按钮完成还原"></textarea>
        </div>
        <div class="app-actions">
            <button type="submit" class="app-button restore">还原数据</button>
        </div>

        <div class="description">将如下代码复制并保存于文本</div>
        <div class="code-preview">
            <pre class="am-pre-scrollable"></pre>
        </div>
    </div>
</div>
</body>
</html>
