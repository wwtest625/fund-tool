<!DOCTYPE html>
<html>
<head>
	<title>我的基金</title>
	<meta charset="utf-8"/>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" href="assets/css/amazeui.min.css">
	<link rel="stylesheet" href="assets/css/apple-design.css">
	<script type="text/javascript" src="js/jquery-1.8.3.js"></script>
	<script type="text/javascript" src="js/dialog.js"></script>
	<script type="text/javascript" src="js/moment.js"></script>
	<script type="text/javascript" src="js/common.js"></script>
	<script type="text/javascript" src="js/popup.js"></script>
</head>
<body>
<div class="am-padding app-shell" data-layout="popup">
    <div class="zan-img"><img src="img/zan.jpg"></div>

	<div class="app-card app-header">
		<div class="app-title">
			<div>
				<h1>我的基金</h1>
				<small>跟随市场节奏的智能组合视图</small>
			</div>
		</div>
		<div class="badge-group">
			<span class="am-link-cursor refresh"><i class="am-icon-refresh"></i> 刷新</span>
			<span class="am-link-cursor document"><i class="am-icon-book"></i> 帮助文档</span>
			<span class="am-link-cursor zan"><i class="am-icon-heart"></i> 捐赠支持</span>
            <span class="am-link-cursor popup"><i class="am-icon-arrows-alt"></i> 详细列表</span>
			<span class="am-link-cursor bak"><i class="am-icon-cloud-upload"></i> 云备份</span>
		</div>
	</div>

	<div class="app-card table-card">
		<div class="table-toolbar">
			<div class="notice-controls">
				<div class="notice-select">
					<select name="notice_type">
						<option value="">请选择通知设置</option>
						<option value="1">开启所有通知</option>
						<option value="2">暂停所有通知</option>
						<option value="4">暂停卖出通知</option>
						<option value="6">暂停补仓通知</option>
					</select>
					<span class="am-btn am-btn-xs am-btn-success update-notice"><i class="am-icon-cog"></i> 更改设置</span>
				</div>
				<div class="notice-legend">
					<span><i class="am-icon-pause"></i> 暂停所有通知</span>
					<span><i class="am-icon-line-chart"></i> 暂停卖出通知</span>
					<span><i class="am-icon-sort-amount-desc"></i> 暂停补仓通知</span>
				</div>
			</div>
		</div>
		<table class="fund-table">
			<colgroup>
				<col class="col-name">
				<col class="col-code">
				<col class="col-price">
				<col class="col-price">
				<col class="col-price">
				<col class="col-holding">
				<col class="col-latest">
				<col class="col-profit">
				<col class="col-net">
				<col class="col-hold-profit">
				<col class="col-actions">
			</colgroup>
			<thead>
			<tr>
				<th class="fund-name-header">
					<label>
						<input type="checkbox" class="checkbox-all">
						<strong>基金名称</strong>
					</label>
				</th>
				<th>基金代码</th>
				<th>成本价</th>
				<th>补仓价格提醒</th>
				<th>卖出价格提醒</th>
				<th>持有份额</th>
				<th>最新价格</th>
				<th>盈亏估算</th>
				<th class="am-show-lg-only">单位净值</th>
				<th class="am-show-lg-only">持有收益</th>
				<th>操作</th>
			</tr>
			</thead>
			<tbody>
			<tr id="add">
				<td class="fund-name-column"></td>
				<td>
					<input type="text" value="" placeholder-text="基金代码" name="code" />
				</td>
				<td>
					<input type="text" value="" placeholder-text="购入价格"  name="buy" />
				</td>
				<td>
					<input type="text" value="" placeholder-text="补仓价格提醒" name="adding" />
				</td>
				<td>
					<input type="text" value="" placeholder-text="卖出价格提醒" name="sell" />
				</td>
				<td>
					<input type="text" value="" placeholder-text="持有份额"  name="fene" />
				</td>
				<td>-</td>
				<td>-</td>
				<td class="am-show-lg-only">-</td>
				<td class="am-show-lg-only">-</td>
				<td><span class="am-btn am-btn-xs am-btn-success"><i class="am-icon-plus"></i> 新增</span></td>
			</tr>
			<tr class="summary-row">
				<td class="fund-name-column summary-label" colspan="7">估算合计</td>
				<td class="total numeric-cell numeric-readout">0.00</td>
				<td class="am-show-lg-only summary-label">持有合计</td>
				<td class="am-show-lg-only total_jingzhi numeric-cell numeric-readout">-</td>
				<td></td>
			</tr>
			</tbody>
		</table>
		<div class="empty-state" style="display:none"></div>
	</div>
</div>
<div class="help_content am-padding-xs" style="display: none">
	<p>若您是初次使用本扩展，对功能不熟悉的话，请点击《帮助文档》，该文档将会详细介绍本扩展使用的方法。</p>
	<p>点击 X 按钮，引导功能将不再显示</p>
</div>
</body>
</html>
